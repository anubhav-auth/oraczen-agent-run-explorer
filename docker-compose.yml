services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: oraczen-backend
    environment:
      RUNS_PATH: data/runs.jsonl
      PORT: "8000"
      FRONTEND_ORIGIN: http://localhost:3000
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    container_name: oraczen-frontend
    environment:
      API_URL: http://backend:8000
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
